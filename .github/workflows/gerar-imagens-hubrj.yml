name: Gerar imagens das startups HUB RJ

on:
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantidade máxima de imagens novas (1 a 84)"
        required: true
        type: choice
        default: "3"
        options: ["1", "3", "5", "10", "84"]
      apenas_verificar:
        description: "Somente conferir os próximos projetos, sem gastos de API"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [".github/hubrj-image-request.json"]

permissions:
  contents: write
  pages: write

concurrency:
  group: hubrj-image-production
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  gerar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Buscar repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar verificação de imagens
        run: python -m pip install 'Pillow>=11,<14'

      - name: Validar protocolos, preservação e retomada
        run: |
          python -m unittest discover -s scripts -p 'test_generate_hubrj_images.py' -v
          python scripts/generate_hubrj_images.py --validate-only

      - name: Ler solicitação do lote
        id: pedido
        env:
          QUANTIDADE: ${{ inputs.quantidade }}
          APENAS_VERIFICAR: ${{ inputs.apenas_verificar }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              content = subprocess.check_output([
                  'git', 'show', os.environ['GITHUB_SHA'] + ':.github/hubrj-image-request.json'
              ], text=True)
              request = json.loads(content)
          else:
              request = {'quantidade': int(os.environ['QUANTIDADE']),
                         'apenas_verificar': os.environ['APENAS_VERIFICAR'] == 'true'}
          if type(request.get('quantidade')) is not int or not 1 <= request['quantidade'] <= 84:
              raise SystemExit('Quantidade inválida')
          if type(request.get('apenas_verificar')) is not bool:
              raise SystemExit('Modo de execução inválido')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hubrj-request.json'
          path.write_text(json.dumps(request), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('dry_run=' + str(request['apenas_verificar']).lower() + '\n')
          PY

      - name: Gerar lote com salvamento por protocolo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate_hubrj_images.py \
            --request "$RUNNER_TEMP/hubrj-request.json" \
            --report "$RUNNER_TEMP/hubrj-report.json" --publish

      - name: Publicar alterações no GitHub Pages
        if: ${{ always() && steps.pedido.outputs.dry_run == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, time
          report_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hubrj-report.json'
          if not report_path.exists():
              raise SystemExit(0)
          report = json.loads(report_path.read_text())
          if not report['published']:
              print('Nenhuma imagem publicada neste lote.')
              raise SystemExit(0)
          endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages/builds'
          subprocess.run(['gh', 'api', '--method', 'POST', endpoint, '--silent'], check=True)
          for attempt in range(30):
              build = json.loads(subprocess.check_output(['gh', 'api', endpoint + '/latest']))
              if build.get('commit') == report['last_commit']:
                  if build['status'] == 'built':
                      print('GitHub Pages publicado no commit ' + report['last_commit'])
                      break
                  if build['status'] == 'errored':
                      raise SystemExit('Falha na publicação do GitHub Pages')
              time.sleep(20)
          else:
              raise SystemExit('Publicação do GitHub Pages ainda não confirmada; consulte Actions')
          PY

      - name: Guardar relatório e imagens para recuperação
        if: ${{ always() && steps.pedido.outputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: hubrj-imagens-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/hubrj-report.json
            portal/assets/ai/
