name: Gerar imagens das startups HUB RJ

on:
  workflow_dispatch:
    inputs:
      quantidade:
        description: "Quantidade de novas imagens (1 a 10)"
        required: true
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
      apenas_verificar:
        description: "Somente conferir os próximos projetos, sem gastos de API"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hubrj-image-production
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Buscar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir ou gerar imagens
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIMIT: ${{ inputs.quantidade }}
          DRY_RUN: ${{ inputs.apenas_verificar }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/generate_hubrj_images.py --limit "$LIMIT" --dry-run
          else
            python scripts/generate_hubrj_images.py --limit "$LIMIT"
          fi

      - name: Publicar imagens e atualizar vitrine
        if: ${{ inputs.apenas_verificar == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/assets/ai portal/app.js portal/vitrine.html
          if git diff --cached --quiet; then
            echo "Nenhuma imagem nova para publicar."
          else
            git commit -m "Publica novo lote de imagens das startups HUB RJ"
            git push
          fi
