<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Painel HUB RJ Startup 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra fixa com abas por fase; cada aba empilha KPIs, depois blocos de análise em grade de duas colunas que vira uma no celular. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#132b45; --muted:#5a6b7d; --line:#d9e0e8;
  --f1:#2f6ea6; --f2:#13897f; --accent:#d58a1f; --track:#e7ecf2;
  --good:#2f8a4e; --warn:#c98a12; --bad:#c2513d;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1824; --surface:#152232; --ink:#e6edf5; --muted:#9aabbd; --line:#26384c;
  --f1:#6ba7dc; --f2:#3cc2b4; --accent:#f0a940; --track:#1f3044;
  --good:#5cc07f; --warn:#e5b44a; --bad:#e8826f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1824; --surface:#152232; --ink:#e6edf5; --muted:#9aabbd; --line:#26384c;
  --f1:#6ba7dc; --f2:#3cc2b4; --accent:#f0a940; --track:#1f3044;
  --good:#5cc07f; --warn:#e5b44a; --bad:#e8826f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Login */
.gate{min-height:100vh;display:grid;place-items:center;padding:32px 16px}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:32px 28px;display:grid;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gate-card p{margin:0;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.field input:focus{outline:2px solid var(--f1);outline-offset:0;border-color:transparent}
.btn{background:var(--ink);color:var(--surface);border:0;border-radius:6px;padding:12px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
.lock-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* App */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.tab{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--track);color:var(--ink)}
.tab:hover{color:var(--ink)}
.out{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13px}
main{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;gap:28px}
.head{display:grid;gap:6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--phase,var(--muted))}
.head h1{font-size:clamp(26px,4vw,38px);font-weight:800}
.head p{margin:0;color:var(--muted);max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:2px}
.kpi:nth-child(4n){border-right:0}
.kpi:nth-last-child(-n+4){border-bottom:0}
.kpi b{font-family:var(--display);font-size:28px;font-weight:700;color:var(--phase,var(--ink))}
.kpi span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px;align-content:start;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:17px;font-weight:700}
.panel .sub{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.section-title{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* Barras horizontais */
.hb{display:grid;gap:8px}
.hb-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb-row .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-row .t{height:12px;background:var(--track);border-radius:3px;overflow:hidden}
.hb-row .f{height:100%;background:var(--phase,var(--f1));border-radius:3px}
.hb-row .v{min-width:44px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hb-row .x{color:var(--muted);font-weight:400}
/* Comparativo */
.cmp{display:grid;gap:12px}
.cmp-row{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px}
.cmp-bars{display:grid;gap:3px}
.cmp-bar{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:8px;align-items:center}
.cmp-bar .t{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.cmp-bar .f{height:100%;border-radius:3px}
.cmp-bar span{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* Colunas verticais */
.vb{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.vb-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.vb-col .v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.vb-col .f{width:100%;max-width:56px;background:var(--phase,var(--f1));border-radius:3px 3px 0 0}
.vb-labels{display:flex;gap:8px;margin-top:-8px}
.vb-labels span{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Funil */
.funnel{display:grid;gap:10px}
.fn-row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.fn-top{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.fn-top b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.fn-bar{height:22px;background:var(--track);border-radius:4px;overflow:hidden}
.fn-bar div{height:100%;border-radius:4px}
.fn-note{font-size:12.5px;color:var(--muted)}
/* Pilha 100% */
.stack{display:flex;height:26px;border-radius:4px;overflow:hidden}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.stack-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
/* Faixas */
.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.band{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;border-top:4px solid var(--c)}
.band b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.band span{font-size:12px;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--display);font-size:40px;font-weight:800;color:var(--phase)}
.big span{color:var(--muted);font-size:13px}
/* Tabela */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.code{font-family:var(--mono);font-size:12px;color:var(--phase);white-space:nowrap}
.mini{display:inline-block;height:6px;background:var(--phase);border-radius:2px;vertical-align:middle;margin-right:6px}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pair{border-left:3px solid var(--phase);padding:2px 0 2px 10px}
.pair b{display:block;font-family:var(--display);font-size:20px}
.pair span{font-size:12.5px;color:var(--muted)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.list li{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0;padding-bottom:0}
.list strong{font-weight:600}
.list span{font-size:13px;color:var(--muted)}
.f1{--phase:var(--f1)} .f2{--phase:var(--f2)}

@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(4n){border-right:1px solid var(--line)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:nth-last-child(-n+4){border-bottom:1px solid var(--line)}
  .kpi:nth-last-child(-n+2){border-bottom:0}
  .hb-row{grid-template-columns:minmax(0,120px) minmax(0,1fr) auto}
  .cmp-row{grid-template-columns:minmax(0,1fr)}
  .bands{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){
  .f,.fn-bar div{transition:width .5s ease}
}
</style>
</head>
<body>


<div id="gate" class="gate">
  <form id="login" class="gate-card" autocomplete="on">
    <div class="brand"><b>HUB RJ</b><span>Startup 2025</span></div>
    <div>
      <h1 style="font-size:22px">Painel de execução</h1>
      <p>Fases 01 e 02 do Programa. Acesso restrito à equipe.</p>
    </div>
    <div class="field"><label for="u">Usuário</label><input id="u" name="username" autocomplete="username" required></div>
    <div class="field"><label for="p">Senha</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <p id="err" class="err" role="alert"></p>
    <button id="go" class="btn" type="submit">Entrar</button>
    <p class="lock-note">Os dados desta página ficam criptografados e só abrem com as credenciais corretas.</p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><b>HUB RJ</b><span>Startup 2025</span></div>
      <nav class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-v="geral" aria-selected="true">Visão geral</button>
        <button class="tab" role="tab" data-v="f1" aria-selected="false">Fase 01</button>
        <button class="tab" role="tab" data-v="f2" aria-selected="false">Fase 02</button>
        <button class="tab" role="tab" data-v="cmp" aria-selected="false">Comparativo</button>
      </nav>
      <button class="out" id="out" type="button">Sair</button>
    </div>
  </header>
  <main id="view"></main>
</div>

const ITER = 310000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(user, pass){
  const [salt, iv, ct] = PAYLOAD.split(".").map(b64);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim() + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

let D = null;
const $ = s => document.querySelector(s);
const nf = (v, d=0) => v.toLocaleString("pt-BR", {minimumFractionDigits:d, maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#login").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Verificando…"; $("#err").textContent = "";
  try{
    D = await unlock($("#u").value, $("#p").value);
    $("#p").value = "";
    $("#gate").hidden = true; $("#app").hidden = false;
    show(location.hash.slice(1) || "geral");
  }catch(err){
    $("#err").textContent = "Usuário ou senha incorretos. Confira e tente de novo.";
  }finally{ btn.disabled = false; btn.textContent = "Entrar"; }
});
$("#out").addEventListener("click", () => { D = null; $("#view").innerHTML = ""; $("#app").hidden = true; $("#gate").hidden = false; $("#u").focus(); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if(b) show(b.dataset.v); });

function show(v){
  if(!["geral","f1","f2","cmp"].includes(v)) v = "geral";
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
  const view = $("#view");
  view.className = v === "f1" ? "f1" : v === "f2" ? "f2" : "";
  view.innerHTML = v === "geral" ? geral() : v === "cmp" ? comparativo() : fase(D[v], v);
  window.scrollTo(0,0);
}

/* Componentes */
const panel = (title, body, sub="", wide=false) => `<section class="panel${wide?" wide":""}"><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}${body}</section>`;
function hbars(items, {max, dec=0, suffix="", color}={}){
  const m = max ?? Math.max(...items.map(i => i[1]));
  return `<div class="hb">${items.map(([l,v,x]) => `<div class="hb-row"><span class="l" title="${esc(l)}">${esc(l)}</span><div class="t"><div class="f" style="width:${(v/m*100).toFixed(1)}%${color?`;background:${color}`:""}"></div></div><span class="v">${nf(v,dec)}${suffix}${x!=null?` <span class="x">${x}</span>`:""}</span></div>`).join("")}</div>`;
}
function vbars(labels, vals){
  const m = Math.max(...vals);
  return `<div><div class="vb">${vals.map(v => `<div class="vb-col"><span class="v">${nf(v)}</span><div class="f" style="height:${(v/m*82).toFixed(1)}%"></div></div>`).join("")}</div><div class="vb-labels">${labels.map(l => `<span>${esc(l)}</span>`).join("")}</div></div>`;
}
function compare(labels, a, b, {max, dec=0, labA="Fase 01", labB="Fase 02"}={}){
  const m = max ?? Math.max(...a, ...b);
  const bar = (v, c) => `<div class="cmp-bar"><div class="t"><div class="f" style="width:${(v/m*100).toFixed(1)}%;background:${c}"></div></div><span>${nf(v,dec)}</span></div>`;
  return `<div class="legend"><span><i style="background:var(--f1)"></i>${labA}</span><span><i style="background:var(--f2)"></i>${labB}</span></div>
  <div class="cmp">${labels.map((l,i) => `<div class="cmp-row"><span>${esc(l)}</span><div class="cmp-bars">${bar(a[i],"var(--f1)")}${bar(b[i],"var(--f2)")}</div></div>`).join("")}</div>`;
}
const kpis = list => `<div class="kpis">${list.map(([n,l]) => `<div class="kpi"><b class="num">${n}</b><span>${l}</span></div>`).join("")}</div>`;
const bandColors = ["var(--good)","var(--f1)","var(--warn)","var(--bad)"];
function bands(f){
  const tot = f.reduce((a,b)=>a+b,0);
  return `<div class="bands">${f.map((v,i) => `<div class="band" style="--c:${bandColors[i]}"><b>${v}</b><span>${D.faixasRot[i]}</span><span>${nf(v/tot*100,1)}%</span></div>`).join("")}</div>`;
}

    </div>`;
  }
  return `<div class="head"><span class="eyebrow">${x.nome} · ${x.versao}</span><h1>${x.titulo}</h1><p>${x.sub}. Período ${x.periodo}${isF2?"":`, ${x.processamento}`}.</p></div>
  ${kpis(x.kpis)}
  <div class="section-title">Território</div>
  <div class="grid">
    ${panel(`${isF2?"Startups":"Projetos"} por polo de referência`, hbars(polos), `Região Metropolitana: ${metro} ${ent} (${nf(metro/tot*100,1)}%)`)}
    ${panel("Principais municípios", hbars(x.municipios), `${ent[0].toUpperCase()+ent.slice(1)} distribuídos(as) por ${isF2?26:31} municípios`)}
  </div>
  <div class="section-title">Capacitações</div>
  <div class="pairs"><div class="pair"><b>${x.cap.temas}</b><span>temas na trilha</span></div><div class="pair"><b>${x.cap.turmas}</b><span>turmas</span></div><div class="pair"><b>${x.cap.encontros}</b><span>encontros Tema–Turma</span></div><div class="pair"><b>${x.cap.horasTotal}h</b><span>horas-turma (${x.cap.turmas} × ${x.cap.horasTurma}h)</span></div><div class="pair"><b>${nf(x.cap.presencas)}</b><span>presenças individuais</span></div></div>
  <div class="grid">
    ${panel("Trilha, presenças e percepção", trilha, "Remota e síncrona, com o SEBRAE-RJ. Percepção: média dos dez critérios, escala 0 a 10", true)}
    ${panel("Presenças por turma", turmas, "Unidade: participante presente em cada encontro")}
    ${panel("Percepção por critério", hbars(x.cap.percepcao, {max:10, dec:2}), isF2 ? x.cap.respostas : "Formulário facultativo, escala 0 a 10")}
  </div>
  <div class="section-title">Mentorias</div>
  <div class="pairs"><div class="pair"><b>${x.men.ais}</b><span>Agentes de Inovação</span></div><div class="pair"><b>${nf(x.men.registros)}</b><span>registros${isF2?` (${x.men.padrao} padrão + ${x.men.validacao} S14/S17)`:""}</span></div><div class="pair"><b>${x.men.startups}</b><span>${ent} acompanhados(as)</span></div><div class="pair"><b>${x.men.cobertura}</b><span>${isF2?"em 6 ou mais dos 10 períodos":"cobertura dos 246 projetos"}</span></div><div class="pair"><b>${x.men.mediaReg}</b><span>${isF2?"períodos com presença, em média":"registros por projeto"}</span></div></div>
  <div class="grid">
    ${panel(x.men.serieTitulo, vbars(x.men.serieRot, x.men.serie), `Período ${x.men.periodo}`)}
    ${panel(x.men.distTitulo, vbars(x.men.distRot, x.men.dist), isF2?"Regularidade do acompanhamento, não desempenho":"Regularidade documental, não desempenho")}
    ${panel("Dimensões estruturadas", hbars(D.menDims.map((d,i)=>[d, x.men.dims[i]]), {max:5, dec:2}), `Escala 1 a 5 · média conjunta ${nf(x.men.dimsMedia,2)}${isF2?" · 902 registros com nota":""}`)}
    ${panel("Registros por Agente de Inovação", ai)}
  </div>
  <div class="section-title">Atividades complementares</div>
  ${panel(x.compTotal, `<ul class="list">${x.comp.map(([t,c,d])=>`<li><strong>${t}</strong><span>${c} · ${d}</span></li>`).join("")}</ul>`, "Contabilizadas à parte da trilha principal", true)}
  ${validacao}
  <div class="section-title">Avaliação final · ${p.nome}</div>
  <div class="grid">
    ${panel("Resultado agregado", `<div class="big"><b class="num">${nf(p.media,2)}</b><span>média geral, escala 1 a 10</span></div>
      <div class="pairs"><div class="pair"><b>${p.avaliados}</b><span>${ent} avaliados(as)</span></div><div class="pair"><b>${p.registros}</b><span>registros individuais</span></div><div class="pair"><b>${p.internos} + ${p.externos}</b><span>avaliadores internos + externos</span></div></div>
      <p class="note">${p.periodo} · ${p.local} · 5 min de apresentação e 5 min de arguição.</p>`)}
    ${panel("Médias por dimensão", hbars(p.dimsRot.map((d,i)=>[d,p.dims[i]]), {max:10, dec:2}), `Linha de referência: média geral ${nf(p.media,2)}`)}
    ${panel("Distribuição por faixa de desempenho", bands(p.faixas) + `<p class="note">Faixas de leitura analítica. Não equivalem, isoladamente, à classificação oficial para a fase seguinte.</p>`, "", true)}
  </div>`;
}

/* Comparativo */
function comparativo(){
  const f1 = D.f1, f2 = D.f2;
  const ret = D.polos.map((p,i) => [p, f2.porPolo[i] / f1.porPolo[i] * 100, `${f1.porPolo[i]} → ${f2.porPolo[i]}`]).sort((a,b)=>b[1]-a[1]);
  const pd = ["Conceito do Produto/Serviço","Equipe","Modelo de Negócios","Escalabilidade","Potencial de Mercado"];
  const row = (l,a,b) => `<tr><td>${l}</td><td class="r">${a}</td><td class="r">${b}</td></tr>`;
  const tabela = `<div class="tw"><table><thead><tr><th>Indicador</th><th class="r">Fase 01</th><th class="r">Fase 02</th></tr></thead><tbody>
    ${row("Ingressantes", "246 projetos", "150 startups")}
    ${row("Municípios", "31", "26")}
    ${row("Duração", "12 semanas de PAFE", "20 semanas")}
    ${row("Temas · turmas", "9 · 13", "8 · 8")}
    ${row("Horas por turma · horas-turma", "30h · 390h", "21h · 168h")}
    ${row("Presenças individuais", "2.650", "1.023")}
    ${row("Agentes de Inovação", "20", "17")}
    ${row("Registros de acompanhamento", "741", "1.183")}
    ${row("Atividades complementares", "18h", "6h")}
    ${row("Avaliadores (internos + externos)", "16 + 41", "18 + 14")}
    ${row("Média do pitch final", "6,41", "6,74")}
    ${row("Faixas Destaque + Promissor", "76 (34,9%)", "65 (45,5%)")}
    ${row("Classificados para a fase seguinte", "150 (61,0%)", "143 (95,3%)")}
  </tbody></table></div>`;
  return `<div class="head"><span class="eyebrow">Fase 01 × Fase 02</span><h1>Comparativo entre as fases</h1><p>Indicadores equivalentes das duas etapas. Os instrumentos foram mantidos próximos, o que permite a leitura lado a lado, mas as populações e os objetivos de cada fase são diferentes.</p></div>
  <div class="grid">
    ${panel("Quadro-resumo", tabela, "", true)}
    ${panel("Pitch final: dimensões comuns", compare(pd, f1.pitch.dims.slice(0,5), f2.pitch.dims.slice(0,5), {max:10, dec:2, labA:"Pitch_01", labB:"Pitch_02"}), "Escala 1 a 10. A sexta dimensão mudou entre as fases (orçamento na F01, validação e metas na F02)")}
    ${panel("Mentorias: dimensões estruturadas", compare(D.menDims, f1.men.dims, f2.men.dims, {max:5, dec:2}), "Escala 1 a 5. Validação e Tração Inicial segue como a menor média nas duas fases")}
    ${panel("Percepção das capacitações", compare(f1.cap.percepcao.map(c=>c[0]), f1.cap.percepcao.map(c=>c[1]), f2.cap.percepcao.map(c=>c[1]), {max:10, dec:2}), "Formulário facultativo, escala 0 a 10")}
    ${panel("Permanência por polo", hbars(ret, {max:100, dec:1, suffix:"%"}), "Startups na Fase 02 em relação aos projetos do polo na Fase 01")}
    ${panel("Faixas de desempenho no pitch final", compare(D.faixasRot, f1.pitch.faixas.map(v=>v/218*100), f2.pitch.faixas.map(v=>v/143*100), {max:50, dec:1, labA:"Pitch_01 (% de 218)", labB:"Pitch_02 (% de 143)"}), "Percentual das avaliadas em cada fase", true)}
  </div>`;
}
</script>
